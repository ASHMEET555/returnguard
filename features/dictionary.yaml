# ReturnGuard / MerchantShield Verified 15-Feature Dictionary (Synthetic Model)
# Source of truth: ml/features/build_features.py (FEATURE_COLUMNS)
# Architecture reference: docs/plan/02-architecture.md section C

version: 1.0.0
loss_class: payment_fraud
feature_count: 15

features:
  - name: amount
    type: float
    description: Transaction amount in INR
    leakage_safe: true

  - name: amount_zscore
    type: float
    description: Z-score of transaction amount against customer's expanding prior history
    leakage_safe: true

  - name: amount_vs_avg_ratio
    type: float
    description: Ratio of current amount to customer's historical prior average
    leakage_safe: true

  - name: prior_txn_count
    type: int
    description: Number of strictly prior transactions for this customer (0 for first transaction)
    leakage_safe: true

  - name: time_since_prev_txn_min
    type: float
    description: Elapsed time in minutes since customer's previous transaction (sentinel for first transaction)
    leakage_safe: true

  - name: velocity_5min
    type: int
    description: Count of customer transactions in the trailing 5-minute rolling window
    leakage_safe: true

  - name: velocity_30min
    type: int
    description: Count of customer transactions in the trailing 30-minute rolling window
    leakage_safe: true

  - name: velocity_60min
    type: int
    description: Count of customer transactions in the trailing 60-minute rolling window
    leakage_safe: true

  - name: new_device_flag
    type: int
    description: Binary indicator (1 if device_id has not been seen in customer's prior history, else 0)
    leakage_safe: true

  - name: new_geo_flag
    type: int
    description: Binary indicator (1 if geo_region has not been seen in customer's prior history, else 0)
    leakage_safe: true

  - name: failed_ratio_trailing10
    type: float
    description: Fraction of transactions with status 'failed' in customer's trailing 10 prior transactions
    leakage_safe: true

  - name: account_age_days
    type: float
    description: Elapsed time in days between account creation timestamp and current transaction timestamp
    leakage_safe: true

  - name: hour_of_day
    type: int
    description: Hour of transaction timestamp (0 to 23)
    leakage_safe: true

  - name: is_night
    type: int
    description: Binary indicator (1 if transaction occurred between 23:00 and 06:00 local time, else 0)
    leakage_safe: true

  - name: day_of_week
    type: int
    description: Day of the week of transaction timestamp (0 for Monday to 6 for Sunday)
    leakage_safe: true
